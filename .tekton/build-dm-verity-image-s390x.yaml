apiVersion: tekton.dev/v1
kind: Task
metadata:
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: image-build, konflux
  labels:
    app.kubernetes.io/version: "0.1"
    build.appstudio.redhat.com/build_type: disk-image
  name: build-dm-verity-image-s390x
spec:
  description: "Build disk images for sandboxed containers"
  params:
    - name: OUTPUT_IMAGE
      type: string
      description: The output manifest list that points to the OCI artifact of the zipped image
    - name: SOURCE_ARTIFACT
      type: string
    - default: activation-key
      description: Name of secret which contains subscription activation key
      name: ACTIVATION_KEY
      type: string
    - name: RHEL_IMAGE_CHECKSUM
      type: string
      description: The checksum to use for downloading the RHEL image
      default: e15cb333529c332e76e4b1b946efe3515c99f996546675aec18e8effdf2540a5
    - name: KERNEL_VERSION
      type: string
      description: The kernel version that the stock kernel included with the RHEL image will be updated to
      default: 6.12.0-211.16.1.el10_2
    - name: NVIDIA_DRIVER_VERSION
      type: string
      description: The NVIDIA driver version to install
      default: 595.58.03
    - default: redhat-api-secret
      description: Name of secret which contains the offline token for the Red Hat API
      name: REDHAT_OFFLINE_TOKEN_SECRET
      type: string
    - name: LABELS
      type: string
      description: A comma-separated list of key=value pairs to add as labels to the built image
  results:
    - description: Digest of the manifest list just built
      name: IMAGE_DIGEST
    - description: Image repository where the built manifest list was pushed
      name: IMAGE_URL
    - description: Image reference (IMAGE_URL + IMAGE_DIGEST)
      name: IMAGE_REFERENCE
    - name: SBOM_BLOB_URL
  stepTemplate:
    env:
      - name: OUTPUT_IMAGE
        value: $(params.OUTPUT_IMAGE)
      - name: ACTIVATION_KEY
        value: $(params.ACTIVATION_KEY)
      - name: KERNEL_VERSION
        value: $(params.KERNEL_VERSION)
      - name: NVIDIA_DRIVER_VERSION
        value: $(params.NVIDIA_DRIVER_VERSION)
      - name: BUILDAH_IMAGE
        value: 'registry.access.redhat.com/ubi9/buildah:9.5-1739778322'
      - name: SBOM_TYPE
        value: spdx
      - name: LABELS
        value: $(params.LABELS)
    volumeMounts:
      - mountPath: "/var/workdir"
        name: workdir
      - mountPath: "/var/lib/containers/storage"
        name: varlibcontainers
  steps:
    - name: use-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:4689f88dd253bd1feebf57f1a76a5a751880f739000719cd662bbdc76990a7fd
      args:
        - use
        - $(params.SOURCE_ARTIFACT)=/var/workdir/source
    - name: download-rhel-image
      image: quay.io/konflux-ci/hermeto:0.29.0@sha256:f577e0399953471df7a9826c1550aef83d28e8b35f76dd65a193441822b629ee
      env:
        - name: REDHAT_OFFLINE_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.REDHAT_OFFLINE_TOKEN_SECRET)
              key: offline-token
        - name: RHEL_IMAGE_CHECKSUM
          value: $(params.RHEL_IMAGE_CHECKSUM)
      script: |-
        #!/bin/bash
        set -euo pipefail

        # Check that required variables are populated
        if [ -z "${REDHAT_OFFLINE_TOKEN:-}" ]; then
          echo "Error: REDHAT_OFFLINE_TOKEN is not set"
          exit 1
        fi
        
        if [ -z "${RHEL_IMAGE_CHECKSUM:-}" ]; then
          echo "Error: RHEL_IMAGE_CHECKSUM is not set"
          exit 1
        fi
        
        echo "Using RHEL image checksum: ${RHEL_IMAGE_CHECKSUM}"

        alias curl="curl --retry 5"
        token_api_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
        download_api_url=https://api.access.redhat.com/management/v1/images/${RHEL_IMAGE_CHECKSUM}/download
        token=$(curl "${token_api_url}" \
            -d grant_type=refresh_token -d client_id=rhsm-api -d refresh_token="${REDHAT_OFFLINE_TOKEN}" | jq --raw-output .access_token)
        download_url=$(curl -X 'GET' "${download_api_url}" \
            -H "Authorization: Bearer ${token}" -H 'accept: application/json' | jq --raw-output .body.href)
        filepath="/var/workdir/rhel.iso"
        curl -X GET "${download_url}" -H "Authorization: Bearer ${token}" --output "${filepath}"
        echo "${RHEL_IMAGE_CHECKSUM}" "${filepath}" | sha256sum --check
    - name: setup-cross-arch
      image: quay.io/konflux-ci/buildah-task:latest@sha256:b82d465a06c926882d02b721cf8a8476048711332749f39926a01089cf85a3f9
      computeResources:
        limits:
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 128Mi
      script: |-
        #!/bin/bash
        set -euo pipefail

        mkdir -p ~/.ssh
        if [ -e "/ssh/error" ]; then
          cat /ssh/error
          exit 1
        elif [ -e "/ssh/otp" ]; then
          curl --cacert /ssh/otp-ca -XPOST -d @/ssh/otp $(cat /ssh/otp-server) >~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
        else
          cp /ssh/id_rsa ~/.ssh
        fi
        chmod 0400 ~/.ssh/id_rsa
        export SSH_HOST=$(cat /ssh/host)
        export SSH_ARGS="-o StrictHostKeyChecking=no -o ServerAliveInterval=60"

        ssh $SSH_ARGS "$SSH_HOST" bash -s << 'NODESETUP'
          set -ex

          # ── 1. qemu-system-s390x ─────────────────────────────────────────────
          # Required by virt-install --arch s390x (Stage 1 base image build).
          # On Fedora the RPM exists; on RHEL 9 it must be built from source
          # (no package available). Pull the static binary from a Fedora container
          # so this step works on both distros without a source compile.
          if ! command -v qemu-system-s390x &>/dev/null; then
            sudo podman run --rm -v /usr/local/bin:/out:Z \
              registry.fedoraproject.org/fedora:40 \
              bash -c 'dnf install -y qemu-system-s390x >/dev/null 2>&1 && \
                       cp /usr/bin/qemu-system-s390x /out/'
            sudo chmod 755 /usr/local/bin/qemu-system-s390x
            sudo ln -sf /usr/local/bin/qemu-system-s390x /usr/bin/qemu-system-s390x
            qemu-system-s390x --version
          else
            echo "qemu-system-s390x already present: $(qemu-system-s390x --version | head -1)"
          fi

          # ── 2. qemu-s390x-static ─────────────────────────────────────────────
          # Required by coco-components-s390x.sh (Stage 2): NBD mount + chroot +
          # binfmt_misc so s390x ELF binaries (dnf, dracut, zipl) execute
          # transparently on the x86_64 host. Must be at /usr/local/bin/.
          if [[ ! -x /usr/local/bin/qemu-s390x-static ]]; then
            sudo podman run --rm -v /usr/local/bin:/out:Z \
              registry.fedoraproject.org/fedora:40 \
              bash -c 'dnf install -y qemu-user-static-s390x >/dev/null 2>&1 && \
                       cp /usr/bin/qemu-s390x-static /out/'
            sudo chmod 755 /usr/local/bin/qemu-s390x-static
            file /usr/local/bin/qemu-s390x-static | grep -q "statically linked" || \
              { echo "ERROR: qemu-s390x-static is not statically linked"; exit 1; }
          else
            echo "qemu-s390x-static already present."
          fi

          # ── 3. Kernel modules ─────────────────────────────────────────────────
          # nbd: used by verity-s390x.sh and coco-components-s390x.sh to mount
          #      the qcow2 disk image without a running VM.
          # binfmt_misc: filesystem required to register the qemu-s390x handler.
          sudo modprobe nbd max_part=16 || true
          sudo modprobe binfmt_misc     || true
          [[ -b /dev/nbd0 ]] || { echo "ERROR: /dev/nbd0 not available after modprobe nbd"; exit 1; }

          # ── 4. Restart libvirtd ───────────────────────────────────────────────
          # libvirtd must re-probe emulators after qemu-system-s390x is installed
          # so that virt-install can find the s390-ccw-virtio machine type.
          sudo systemctl restart libvirtd
          sudo virsh domcapabilities \
            --emulatorbin /usr/local/bin/qemu-system-s390x \
            --arch s390x --machine s390-ccw-virtio --virttype qemu \
            | grep -q 's390x' || { echo "ERROR: libvirtd cannot see qemu-system-s390x"; exit 1; }

          # ── 5. binfmt_misc registration ───────────────────────────────────────
          # coco-components-s390x.sh registers/removes this itself per-run, but
          # pre-registering here ensures it is present before the build step starts.
          if [[ ! -f /proc/sys/fs/binfmt_misc/qemu-s390x ]]; then
            echo ':qemu-s390x:M::\x7fELF\x02\x02\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x16:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff:/usr/local/bin/qemu-s390x-static:' \
              | sudo tee /proc/sys/fs/binfmt_misc/register
            echo "Registered binfmt_misc for s390x ELF."
          else
            echo "binfmt_misc for s390x already registered."
          fi

          echo "=== Cross-arch s390x node setup complete ==="
          for c in qemu-system-s390x qemu-img qemu-nbd virt-install virt-customize \
                   veritysetup systemd-repart partprobe e2fsck losetup podman jq; do
            command -v "$c" >/dev/null && echo "OK   $c" || echo "MISS $c"
          done
          [[ -x /usr/local/bin/qemu-s390x-static ]] && echo "OK   qemu-s390x-static" || echo "MISS qemu-s390x-static"
          [[ -b /dev/nbd0 ]] && echo "OK   /dev/nbd0" || echo "MISS /dev/nbd0"
        NODESETUP
      volumeMounts:
        - mountPath: /ssh
          name: ssh
          readOnly: true
    - name: build
      image: quay.io/konflux-ci/buildah-task:latest@sha256:b82d465a06c926882d02b721cf8a8476048711332749f39926a01089cf85a3f9
      computeResources:
        limits:
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 128Mi
      script: |-
        #!/bin/bash
        set -o verbose
        set -eu
        set -x

        mkdir -p ~/.ssh
        if [ -e "/ssh/error" ]; then
          #no server could be provisioned
          cat /ssh/error
          exit 1
        elif [ -e "/ssh/otp" ]; then
          curl --cacert /ssh/otp-ca -XPOST -d @/ssh/otp $(cat /ssh/otp-server) >~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
        else
          cp /ssh/id_rsa ~/.ssh
        fi
        chmod 0400 ~/.ssh/id_rsa
        export SSH_HOST=$(cat /ssh/host)
        export BUILD_DIR=$(cat /ssh/user-dir)
        export SSH_ARGS="-o StrictHostKeyChecking=no -o ServerAliveInterval=60"
        mkdir -p scripts
        echo "$BUILD_DIR"
        ssh -v $SSH_ARGS "$SSH_HOST"  mkdir -p "$BUILD_DIR/workspaces" "$BUILD_DIR/scripts" "$BUILD_DIR/tmp" "$BUILD_DIR/tekton-results" "$BUILD_DIR/activation-key"

        rsync -ra "$HOME/.docker/" "$SSH_HOST:$BUILD_DIR/.docker/"
        rsync -ra /activation-key/ "$SSH_HOST:$BUILD_DIR/activation-key/"

        rsync -ra "/var/workdir/rhel.iso" "$SSH_HOST:$BUILD_DIR/"
        rsync -ra "/var/workdir/source" "$SSH_HOST:$BUILD_DIR/"

        # this unquoted heredoc allows expansions for the image name
        cat >scripts/script-build.sh <<REMOTESSHEOF
        #!/bin/sh
        set -ex

        export BUILD_DIR="$BUILD_DIR"
        export OUTPUT_IMAGE="$OUTPUT_IMAGE"
        export BUILDAH_IMAGE="$BUILDAH_IMAGE"

        REMOTESSHEOF

        # this quoted heredoc prevents expansions and command substitutions. the env vars are evaluated on the remote vm
        cat >>scripts/script-build.sh <<'REMOTESSHEOF'

        mkdir -p output/qcow2/
        echo "RUNNING BUILD"

        # Define paths
        DISK=/output/qcow2/disk.qcow2
        MEASUREMENTS=/output/qcow2/measurements.json

        time sudo podman build --authfile=$BUILD_DIR/.docker/config.json \
          -v $BUILD_DIR/activation-key/:/activation-key/:Z \
          -t builder -f $BUILD_DIR/source/konflux/Dockerfile $BUILD_DIR/source

        # Extract osc-podvm-payload digest from Dockerfile for SBOM
        grep 'osc-podvm-payload@sha256:' $BUILD_DIR/source/konflux/Dockerfile | head -1 | grep -o 'sha256:[a-f0-9]*' > output/payload-digest.txt || true

        time sudo podman run -d --authfile=$BUILD_DIR/.docker/config.json --rm -it --privileged --pull=newer \
          -v ${BUILD_DIR}:/workspace \
          -v $(pwd)/output:/output \
          -v /lib/modules:/lib/modules:ro,Z \
          -v $BUILD_DIR/activation-key/:/activation-key/:Z \
          --user 0 \
          --security-opt=apparmor=unconfined \
          --security-opt=seccomp=unconfined \
          --mount type=bind,source=/dev,target=/dev \
          --mount type=bind,source=/run/udev,target=/run/udev \
          --env=LIBGUESTFS_BACKEND=direct \
          builder

        time sudo podman exec --latest bash -c 'until virsh list --all >/dev/null 2>&1; do sleep 2; done'

        # s390x: cross-arch virt-install using qemu-system-s390x emulation.
        # Uses the s390x kickstart (no --boot uefi, console=ttysclp0).
        time sudo podman exec -t --latest virt-install \
          --virt-type qemu \
          --cpu host-model \
          --os-variant rhel10.0 \
          --arch s390x \
          --name disk \
          --memory 8192 \
          --location /workspace/rhel.iso \
          --disk path=$DISK,format=qcow2,bus=scsi,size=7 \
          --initrd-inject=/workspace/source/helpers/rhel10-s390x-dm-root.ks \
          --nographics \
          --extra-args 'console=ttysclp0 inst.ks=file:/rhel10-s390x-dm-root.ks' \
          --transient

        # Stage 2: install CoCo components into the s390x disk image.
        # coco-components-s390x.sh auto-detects x86_64 host and uses NBD mount +
        # chroot + qemu-s390x-static (binfmt_misc) instead of virt-customize.
        ARTIFACTS_FOLDER=/workspace/source/scripts/coco/podvm \
          /workspace/source/scripts/coco/coco-components-s390x.sh $DISK

        # Stage 3: apply dm-verity using the s390x pipeline.
        # create-verity-podvm-s390x.sh auto-sets LIBGUESTFS_HV=qemu-system-s390x
        # when running on a non-s390x host.
        /workspace/source/scripts/verity/verity-s390x.sh $DISK

        # Stage 4: PCR measurement.
        # OVMF (x86_64 EFI) is not applicable for s390x; write an empty
        # measurements file so the push step continues without modification.
        echo '{"measurements":{}}' > $MEASUREMENTS

        # Push image
        time sudo podman run --authfile=$BUILD_DIR/.docker/config.json --rm -it --privileged --pull=newer --security-opt label=type:unconfined_t \
          -v $BUILD_DIR/.docker:/.docker \
          -v $(pwd)/output:/output \
          -v /var/lib/containers/storage:/var/lib/containers/storage \
          -v $BUILD_DIR/scripts/script-push.sh:/script-push.sh \
          -v $BUILD_DIR/tekton-results:/tekton-results \
          "$BUILDAH_IMAGE" \
          /script-push.sh $DISK $MEASUREMENTS

        # Copy SBOM data to BUILD_DIR for transfer back to Tekton pod
        cp -r output/rootfs $BUILD_DIR/ 2>/dev/null || true
        cp output/payload-digest.txt $BUILD_DIR/ 2>/dev/null || true

        REMOTESSHEOF

        # NOTE: script-disk-mods, script-podvm-maker, podvm-setup, and script-verity
        # heredocs are intentionally removed for s390x. The build steps above
        # delegate directly to the s390x scripts already present in the source tree:
        #   - scripts/coco/coco-components-s390x.sh  (stages disk-mods + podvm-maker)
        #   - scripts/verity/verity-s390x.sh          (dm-verity)
        # No inline x86_64 logic is needed here.

        cat >>scripts/script-verity-stub.sh <<'REMOTESSHEOF'
        #!/bin/bash
        # stub: s390x verity is applied by verity-s390x.sh called directly in script-build.sh
        echo "verity-stub: nothing to do for s390x"
        REMOTESSHEOF

        cat >>scripts/script-verity.sh <<'REMOTESSHEOF'
        #!/bin/bash
        set -ex

        # Accept disk path as first argument
        if [ -z "$1" ]; then
          echo "Error: Disk path not provided"
          echo "Usage: $0 <disk-path>"
          exit 1
        fi

        DISK="$1"

        ADDON_SBAT="sbat,1,SBAT Version,sbat,1,https://github.com/rhboot/shim/blob/main/SBAT.md
        coco-podvm-uki-addon,1,Red Hat,coco-podvm-uki-addon,1,mailto:secalert@redhat.com"

        NBD_DEVICE=/dev/nbd0
        EFI_PN=nbd0p1
        ROOT_PN=nbd0p2

        LUKS_MINIMAL_SPACE_MB=2500
        VERITY_MAX_SPACE_MB=512
        DISK_FORMAT=qcow2

        # Resize the disk
        MB=$((1024 * 1024))
        current_size=$(qemu-img info -f $DISK_FORMAT --output json $DISK | jq '."virtual-size"')
        # new_size=$((current_size * 110 / 100)) # increase 10% for verity - obsolete
        luks_min_space=$((LUKS_MINIMAL_SPACE_MB * MB))
        verity_max_space=$((current_size * 7 / 100))
        new_size=$((current_size + luks_min_space + verity_max_space))
        rounded_size=$(((new_size + MB - 1) / MB * MB))
        echo "Current disk size: $current_size"
        echo "New disk size: $rounded_size"
        qemu-img resize "$DISK" -f $DISK_FORMAT "${rounded_size}"

        temp_dir=$(mktemp -d)
        cd $temp_dir

        temp_mount=$temp_dir/mnt
        mkdir $temp_mount

        modprobe nbd
        qemu-nbd -c $NBD_DEVICE -f $DISK_FORMAT $DISK
        udevadm settle
        sleep 2

        # Debug
        fdisk -l $NBD_DEVICE

        # call_fsck
        fs_type=$(blkid -o value -s TYPE /dev/$ROOT_PN)
        fsck.$fs_type -p /dev/$ROOT_PN

        # update the values in the conf files
        sed -i "s|{INSERT_HERE}|$current_size|g" /workspace/source/konflux/verity-definitions/root.conf
        sed -i "s|{INSERT_HERE}|$verity_max_space|g" /workspace/source/konflux/verity-definitions/verity.conf

        # apply_dmverity
        # create config files and folders for systemd-repart and UKI
        systemd-repart $NBD_DEVICE --dry-run=no --definitions=/workspace/source/konflux/verity-definitions/ --no-pager --json=pretty | jq -r '.[] | select(.type == "root-x86-64-verity") | .roothash' > roothash.txt
        RH=$(cat roothash.txt)

        partprobe $NBD_DEVICE
        # Allow udev events to settle again after partprobe
        udevadm settle
        sleep 1 # Optional small sleep just in case

        if [ "$RH" == "TBD" ]; then
            echo "roothash is TBD, something went wrong. Make sure the image you are using doesn't have a /verity partition already!"
            echo "Exiting."
            exit 1
        fi

        # create_uki_addon
        UKI_FOLDER=$temp_mount/EFI/Linux
        ADDON_NAME=verity.addon.efi
        mount /dev/$EFI_PN $temp_mount
        efi_files=($UKI_FOLDER/*.efi)
        # Check if any EFI files exist
        if [[ ${#efi_files[@]} -eq 0 || ! -f "${efi_files[0]}" ]]; then
            echo "Error: No .efi files found in $UKI_FOLDER"
            exit 1
        fi

        # If multiple files, pick the most recent one
        if [[ ${#efi_files[@]} -gt 1 ]]; then
            echo "Found ${#efi_files[@]} EFI files: ${efi_files[@]}"
            echo ""
            echo "Current EFI fallback value (/boot/efi/EFI/redhat/BOOTX64.CSV):"
            cat mnt/EFI/redhat/BOOTX64.CSV
            echo ""
            echo "Selecting the most recently modified UKI..."
            UKI_NAME=$(ls -t "${efi_files[@]}" | head -1)
        else
            UKI_NAME=${efi_files[0]}
        fi

        echo "Using UKI: $UKI_NAME"
        mkdir -p "$UKI_NAME.extra.d"
        cd $UKI_NAME.extra.d
        rm -f $ADDON_NAME

        if [[ -n "$SB_PRIVATE_KEY" && -n "$SB_CERTIFICATE" ]]; then
            ADDON_OPTIONS="--secureboot-private-key=$SB_PRIVATE_KEY --secureboot-certificate=$SB_CERTIFICATE"
            echo "Signing addon with $SB_PRIVATE_KEY and $SB_CERTIFICATE"
        fi
        /usr/lib/systemd/ukify build --cmdline="roothash=$RH systemd.volatile=overlay" --output=$ADDON_NAME --sbat="$ADDON_SBAT" $ADDON_OPTIONS
        echo "Created UKI addon $UKI_NAME.extra.d/$ADDON_NAME"
        /usr/lib/systemd/ukify inspect $ADDON_NAME
        cd
        umount $temp_mount

        # Debug
        fdisk -l $NBD_DEVICE

        # umount
        qemu-nbd --disconnect $NBD_DEVICE
        REMOTESSHEOF

        # script-push.sh script is intended run _inside_ podman on the ssh host and requires sudo
        # this unquoted heredoc allows expansions for the image name
        cat >scripts/script-push.sh <<REMOTESSHEOF
        #!/bin/bash
        set -ex

        export OUTPUT_IMAGE="$OUTPUT_IMAGE"
        export LABELS="$LABELS"

        REMOTESSHEOF

        # this quoted heredoc prevents expansions and command substitutions. the env vars are evaluated on the remote vm
        cat >>scripts/script-push.sh <<'REMOTESSHEOF'
        # This script pushes a PodVM disk image to a container registry
        # Arguments:
        #   $1: DISK_PATH - Path to the qcow2 disk image
        #   $2: MEASUREMENTS_PATH - Path to the measurements JSON file

        if [ -z "$1" ] || [ -z "$2" ]; then
          echo "Error: Disk path and measurements path not provided"
          echo "Usage: $0 <disk-path> <measurements-path> [suffix]"
          exit 1
        fi

        DISK_PATH="$1"
        MEASUREMENTS_PATH="$2"

        dnf -y install buildah skopeo pigz jq

        image_name="dm-verity-image"
        buildah_container=$(buildah from scratch)
        buildah add $buildah_container "$DISK_PATH" image/podvm.qcow2
        buildah add $buildah_container "$MEASUREMENTS_PATH" image/measurements.json
        # Get the list of labels from the LABELS env variable and apply them to the image
        IFS=',' read -ra LABEL_ARRAY <<< "$LABELS"
        for label in "${LABEL_ARRAY[@]}"; do
          # Remove leading and trailing whitespace from the label
          label=$(echo "$label" | xargs)
          buildah config --label "$label" $buildah_container
        done

        # Add PCR values as OCI manifest annotations
        ANNOTATION_ARGS=()
        if [ -f "$MEASUREMENTS_PATH" ]; then
          # Extract hash algorithm and PCR values from measurements.json
          alg=$(jq -r '.measurements | keys[0]' "$MEASUREMENTS_PATH")

          # Add hash algorithm as separate annotation
          ANNOTATION_ARGS+=(--annotation "io.github.confidential-containers.measurements.algorithm=${alg}")

          # Add each PCR value as a separate annotation
          for pcr in $(jq -r ".measurements.${alg} | keys[]" "$MEASUREMENTS_PATH"); do
            pcr_value=$(jq -r ".measurements.${alg}.${pcr}" "$MEASUREMENTS_PATH")
            ANNOTATION_ARGS+=(--annotation "io.github.confidential-containers.measurements.${pcr}=${pcr_value}")
          done
        fi

        buildah commit "${ANNOTATION_ARGS[@]}" $buildah_container $image_name
        buildah push --digestfile image-digest --authfile /.docker/config.json --retry 10 --all $image_name $OUTPUT_IMAGE

        MANIFEST_DIGEST=$(cat image-digest)

        # Finally, record all that in our results
        echo -n "$OUTPUT_IMAGE" | tee /tekton-results/IMAGE_URL
        echo -n $MANIFEST_DIGEST | tee /tekton-results/IMAGE_DIGEST
        # Saving also these two output in one unique variable. This task is using a matrix reference.
        # Unfortunately it seems that in Tekton, when using a matrix, each task run is executed in isolation,
        # and result values can't be dynamically constructed or reused across matrix combinations.
        # In order to prevent that, we are preparing in the task itself what we'll call as `IMAGE_REFERENCE`
        # so that we can reference that safely in the pipeline.
        IMAGE_URL_CLEANED=$(echo -n "$OUTPUT_IMAGE" | tr -d '\n')
        echo -n "${IMAGE_URL_CLEANED}@${MANIFEST_DIGEST}" | tee /tekton-results/IMAGE_REFERENCE
        REMOTESSHEOF

        cat >scripts/podvm-measure.sh <<'REMOTESSHEOF'
        #!/bin/bash
        set -euo pipefail

        # PCR measurement via OVMF (x86_64 EFI firmware) is not applicable for
        # s390x. Write an empty measurements file so the push step can proceed
        # without changes. A proper s390x vTPM measurement flow is tracked
        # separately.
        if [ -z "$2" ]; then
          echo "Error: output file not provided"
          echo "Usage: $0 <disk-path> <output-measurements-file>"
          exit 1
        fi

        OUTPUT_FILE="$2"
        echo '{"measurements":{}}' > "$OUTPUT_FILE"
        echo "s390x: PCR measurement skipped — empty measurements.json written to $OUTPUT_FILE"
        REMOTESSHEOF

        # make scripts executable and sync them to the cloud VM.
        chmod +x scripts/*.sh
        rsync -ra scripts "$SSH_HOST:$BUILD_DIR"
        rsync -ra /var/workdir/source/ "$SSH_HOST:$BUILD_DIR/workspaces/source/"

        ssh -v $SSH_ARGS "$SSH_HOST" $BUILD_DIR/scripts/script-build.sh
        rsync -ra "$SSH_HOST:$BUILD_DIR/tekton-results/*" "/tekton/results/"

        # Retrieve SBOM data from remote host
        rsync -ra "$SSH_HOST:$BUILD_DIR/rootfs/" "/var/workdir/rootfs/" 2>/dev/null || true
        rsync "$SSH_HOST:$BUILD_DIR/payload-digest.txt" "/var/workdir/" 2>/dev/null || true
      volumeMounts:
        - mountPath: /ssh
          name: ssh
          readOnly: true
        - mountPath: /activation-key
          name: activation-key
    - name: sbom-syft-generate
      image: ghcr.io/anchore/syft:latest@sha256:484dc49cd5869780d8a8e1b2fa2d9381cc1388fc32caeb69e8be81e3ae08bbb1
      command:
        - /syft
      args:
        - scan
        - dir:/var/workdir/rootfs
        - -o
        - spdx-json=/var/workdir/syft-sbom.json
      volumeMounts:
        - mountPath: /var/workdir
          name: workdir
    - name: sbom-generate
      image: quay.io/konflux-ci/mobster@sha256:1374bc35c71781987cce00ef5efe2be42923f83def19b60a570e947189b90d15
      script: |
        #!/bin/bash
        set -euo pipefail

        IMAGE_URL=$(cat "$(results.IMAGE_URL.path)")
        IMAGE_DIGEST=$(cat "$(results.IMAGE_DIGEST.path)")

        SYFT_SBOM="/var/workdir/syft-sbom.json"
        SBOM_FILE="/var/workdir/sbom.json"
        PAYLOAD_DIGEST_FILE="/var/workdir/payload-digest.txt"

        MOBSTER_ARGS=(
          generate --output "$SBOM_FILE" oci-image
          --from-syft "$SYFT_SBOM"
          --image-pullspec "$IMAGE_URL"
          --image-digest "$IMAGE_DIGEST"
        )

        if [ -f "$PAYLOAD_DIGEST_FILE" ]; then
          PAYLOAD_DIGEST=$(tr -d '[:space:]' < "$PAYLOAD_DIGEST_FILE")
          if [ -n "$PAYLOAD_DIGEST" ]; then
            MOBSTER_ARGS+=(--additional-base-image "quay.io/redhat-user-workloads/ose-osc-tenant/osc-podvm-payload:latest@${PAYLOAD_DIGEST}")
          fi
        fi

        mobster "${MOBSTER_ARGS[@]}"

    - name: upload-sbom
      image: quay.io/konflux-ci/appstudio-utils:1610c1fc4cfc9c9053dbefc1146904a4df6659ef@sha256:90ac97b811073cb99a23232c15a08082b586c702b85da6200cf54ef505e3c50c
      workingDir: /var/workdir
      script: |
        # Pre-select the correct credentials to work around cosign not supporting the containers-auth.json spec
        mkdir -p /tmp/auth && select-oci-auth "$(cat "$(results.IMAGE_REFERENCE.path)")" > /tmp/auth/config.json
        DOCKER_CONFIG=/tmp/auth cosign attach sbom --sbom sbom.json --type "$SBOM_TYPE" "$(cat "$(results.IMAGE_REFERENCE.path)")"
    - name: report-sbom-url
      image: quay.io/konflux-ci/yq:latest@sha256:15d0238843d954ee78c9c190705eb8b36f6e52c31434183c37d99a80841a635a
      script: |
        #!/bin/bash
        REPO=${OUTPUT_IMAGE%:*}
        echo "Found that ${REPO} is the repository for ${OUTPUT_IMAGE}"
        SBOM_DIGEST=$(sha256sum sbom.json | awk '{ print $1 }')
        echo "Found that ${SBOM_DIGEST} is the SBOM digest"
        echo -n "${REPO}@sha256:${SBOM_DIGEST}" | tee $(results.SBOM_BLOB_URL.path)
      workingDir: /var/workdir
  volumes:
    - emptyDir: {}
      name: workdir
    - emptyDir: {}
      name: varlibcontainers
    - name: ssh
      secret:
        optional: false
        secretName: multi-platform-ssh-$(context.taskRun.name)
    - name: activation-key
      secret:
        optional: true
        secretName: $(params.ACTIVATION_KEY)
