apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/confidential-devhub/coco-podvm-scripts?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "main" && ( ".tekton/osc-dm-verity-image-s390x-pull-request.yaml".pathChanged() || ".tekton/build-pipeline-s390x.yaml".pathChanged() || ".tekton/build-dm-verity-image-s390x.yaml".pathChanged() || "konflux/Dockerfile".pathChanged() )
  labels:
    appstudio.openshift.io/application: openshift-sandboxed-containers
    appstudio.openshift.io/component: osc-dm-verity-image-s390x
    pipelines.appstudio.openshift.io/type: build
  name: osc-dm-verity-image-s390x-on-pull-request
  namespace: ose-osc-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/ose-osc-tenant/osc-dm-verity-image-s390x:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: Dockerfile
  - name: additional-tags
    value:
      - pr-{{pull_request_number}}
      - pullreq-{{pull_request_number}}-{{revision}}
  taskRunSpecs:
    - pipelineTaskName: build-vm-image
      stepSpecs:
        - name: download-rhel-image
          computeResources:
            requests:
              memory: 8Gi
            limits:
              memory: 8Gi
  pipelineRef:
    name: build-pipeline-s390x
  taskRunTemplate:
    serviceAccountName: build-pipeline-osc-dm-verity-image-s390x
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
